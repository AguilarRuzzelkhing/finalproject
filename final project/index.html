<!DOCTYPE html>
<html>

<head>
    <title>Famous Car Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f0f92, #7806a5);
  color: white;
  min-height: 100vh;
}


.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}


.btn {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  background: #ff4d6d;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #ff4d6d;
}


.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 40px;
}


.card {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.3);
}


.card img {
  width: 100%;
  border-radius: 15px;
}


.header {
  text-align: center;
  padding: 30px;
  font-size: 2rem;
}


.fade {
  animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
<body class="fade">
    <div class="center">
        <h1>CAR HUB</h1>
        <p>Wondering what cars are the best of the bests? Click "ENTER" to discover fascinating cars around the globe.</p>
        <a href="brandrace.html" class="btn">ENTER</a>
    </div>
</body>

</html>
