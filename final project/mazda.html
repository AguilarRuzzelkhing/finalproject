<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff9900, #4ecc06);
  color: white;
  min-height: 100vh;
}


.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}


.btn {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  background: #ff4d6d;
  color: rgb(247, 244, 244);
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #9e6671;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 40px;
}


.card {
  background: linear-gradient(135deg, #ff9900, #4ecc06);
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.3);
}


.card img {
  width: 60%;
  height: 70%;
  border-radius: 15px;
}


.header {
  text-align: center;
  padding: 30px;
  font-size: 2rem;
}


.fade {
  animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
