<!DOCTYPE html>
<html>
<head>
<title>Brands</title>
<link rel="stylesheet" href="style.css">
</head>

<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #07cf22, #f50606);
  color: white;
  min-height: 100vh;
}


.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}


.btn {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  background: #ff4d6d;
  color: rgb(255, 255, 255);
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #a8364b;
}


.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 40px;
}


.card {
  background: linear-gradient(135deg, #f50606,  #07cf22);
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  text-decoration: none;
  color: rgb(243, 243, 243);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.3);
}


.card img {
  width: 100%;
  border-radius: 15px;
}


.header {
  text-align: center;
  padding: 30px;
  font-size: 2rem;
}


.fade {
  animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>

<body class="fade">
<h1 class="header">Choose a Brand</h1>

<div class="grid">
  <a href="ferrari.html" class="card"><h1>FERRARI</h1>
    <p>Horse's Field</p>
  </a>
  <a href="lamborghini.html" class="card"><h1>LAMBORGINI</h1>
    <p>Bull's Turf</p>
  </a>

</div>

<a href="brandrace.html" class="btn">Back</a>
</body>
</html>
